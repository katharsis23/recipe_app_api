

services:
    app:
      build:
        context: .
        args:
          - DEV=true
      restart: always
      ports:
        - "8000:8000"
      volumes:
        - ./recipe_app/:/recipe_app
      command: >
        sh -c "python3 manage.py migrate && 
               python manage.py runserver 0.0.0.0:8000"
      env_file:
        - .env 
      depends_on:
        - database

    database:
      image: postgres:17.6-trixie
      volumes: 
        - dev-db-data:/var/lib/postgresql/data 
      env_file:
        - .env
      ports:
      - "5433:${POSTGRES_PORT}"

volumes:
  dev-db-data:


